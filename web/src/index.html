<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSSM 커뮤니티</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="logo" onclick="showList()">
          <span class="logo-bracket">[</span>BSSM 커뮤니티<span class="logo-bracket">]</span>
        </div>
        <div class="header-actions">
          <span id="header-username" class="header-username hidden"></span>
          <button id="btn-login" class="btn-auth" onclick="showAuthModal()">로그인</button>
          <button id="btn-logout" class="btn-auth-out hidden" onclick="logout()">로그아웃</button>
          <button class="btn-write" onclick="showWrite()">+ 글쓰기</button>
        </div>
      </div>
    </header>

    <div id="auth-modal" class="modal-overlay hidden" onclick="if (event.target === this) hideAuthModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="hideAuthModal()">✕</button>
        <div class="modal-tabs">
          <button id="tab-login" class="modal-tab active" onclick="switchAuthTab('login')">로그인</button>
          <button id="tab-signup" class="modal-tab" onclick="switchAuthTab('signup')">회원가입</button>
        </div>
        <div id="auth-login" class="auth-form">
          <div class="form-group">
            <label>닉네임</label>
            <input type="text" id="login-username" placeholder="닉네임 입력" onkeydown="if (event.key === 'Enter') login()" />
          </div>
          <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="login-password" placeholder="비밀번호 입력" onkeydown="if (event.key === 'Enter') login()" />
          </div>
          <div id="login-error" class="auth-error hidden"></div>
          <button class="btn-submit full" onclick="login()">로그인</button>
        </div>
        <div id="auth-signup" class="auth-form hidden">
          <div class="form-group">
            <label>닉네임</label>
            <input type="text" id="signup-username" placeholder="닉네임 입력" onkeydown="if (event.key === 'Enter') signup()" />
          </div>
          <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="signup-password" placeholder="비밀번호 (4자 이상)" onkeydown="if (event.key === 'Enter') signup()" />
          </div>
          <div class="form-group">
            <label>비밀번호 확인</label>
            <input type="password" id="signup-password-confirm" placeholder="비밀번호 재입력" onkeydown="if (event.key === 'Enter') signup()" />
          </div>
          <div id="signup-error" class="auth-error hidden"></div>
          <button class="btn-submit full" onclick="signup()">회원가입</button>
          <p class="auth-note">※ 회원가입 없이도 닉네임 + 비밀번호를 입력하여 글을 작성할 수 있습니다.</p>
        </div>
      </div>
    </div>

    <main id="view-list">
      <div class="container">
        <div class="list-header">
          <div class="page-title">
            <h2>전체 글 <span id="post-count" class="count-badge">0</span></h2>
          </div>
          <div class="search-box">
            <input
              type="text"
              id="search-input"
              placeholder="제목 검색..."
              onkeydown="if (event.key === 'Enter') searchPosts()"
            />
            <button class="btn-search" onclick="searchPosts()">검색</button>
          </div>
        </div>
        <div id="posts-container">
          <div class="loading">불러오는 중...</div>
        </div>
        <div id="pagination" class="pagination"></div>
      </div>
    </main>

    <main id="view-write" class="hidden">
      <div class="container narrow">
        <div class="page-title">
          <h2>새 글 작성</h2>
          <button class="btn-back" onclick="showList()">← 목록으로</button>
        </div>
        <div class="form-card">
          <div class="form-group" id="write-username-group">
            <label>닉네임</label>
            <input type="text" id="write-username" placeholder="닉네임 입력" />
          </div>
          <div class="form-group" id="write-password-group">
            <label>비밀번호</label>
            <input type="password" id="write-password" placeholder="게스트: 수정/삭제 시 필요" />
          </div>
          <div class="form-group">
            <label>제목</label>
            <input type="text" id="write-title" placeholder="제목을 입력하세요" />
          </div>
          <div class="form-group">
            <label>내용</label>
            <textarea id="write-content" rows="8" placeholder="내용을 입력하세요"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn-cancel" onclick="showList()">취소</button>
            <button class="btn-submit" onclick="submitPost()">게시하기</button>
          </div>
        </div>
      </div>
    </main>

    <main id="view-edit" class="hidden">
      <div class="container narrow">
        <div class="page-title">
          <h2>글 수정</h2>
          <button class="btn-back" onclick="showDetail(currentPostId)">← 돌아가기</button>
        </div>
        <div class="form-card">
          <div class="form-group">
            <label>제목</label>
            <input type="text" id="edit-title" placeholder="제목을 입력하세요" />
          </div>
          <div class="form-group">
            <label>내용</label>
            <textarea id="edit-content" rows="8" placeholder="내용을 입력하세요"></textarea>
          </div>
          <div class="form-group" id="edit-username-group">
            <label>닉네임 확인</label>
            <input type="text" id="edit-username" placeholder="작성 시 사용한 닉네임" />
          </div>
          <div class="form-group" id="edit-password-group">
            <label>비밀번호</label>
            <input type="password" id="edit-password" placeholder="게스트: 작성 시 설정한 비밀번호" />
          </div>
          <div class="form-actions">
            <button class="btn-cancel" onclick="showDetail(currentPostId)">취소</button>
            <button class="btn-submit" onclick="updatePost()">수정하기</button>
          </div>
        </div>
      </div>
    </main>

    <main id="view-detail" class="hidden">
      <div class="container narrow">
        <div class="detail-top-bar">
          <button class="btn-back" onclick="showList()">← 목록으로</button>
          <div class="detail-actions">
            <button class="btn-edit" onclick="showEdit(currentPostId)">수정</button>
            <button class="btn-delete" onclick="deletePost()">삭제</button>
          </div>
        </div>
        <div id="post-detail"></div>
        <div class="comment-section">
          <h3 class="comment-title">
            댓글 <span id="comment-count" class="count-badge">0</span>
          </h3>
          <div id="comments-container"></div>
          <div class="comment-form">
            <div class="comment-inputs">
              <input type="text" id="comment-username" placeholder="닉네임" />
              <input type="password" id="comment-password" placeholder="비밀번호 (게스트)" />
              <input
                type="text"
                id="comment-content"
                placeholder="댓글을 입력하세요"
                onkeydown="if (event.key === 'Enter') submitComment();"
              />
            </div>
            <button class="btn-submit small" onclick="submitComment()">등록</button>
          </div>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
